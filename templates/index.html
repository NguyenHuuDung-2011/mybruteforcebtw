<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCCD Scraper Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="10"> <!-- Tự động refresh trang mỗi 10 giây -->
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📊 CCCD Scraper Dashboard</h1>
            <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1.5 rounded-full">System Running (Auto-refresh 10s)</span>
        </div>
        
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">#</th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Họ và Tên</th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Số CCCD</th>
                        <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Thời gian ghi nhận</th>
                    </tr>
                </thead>
                <tbody>
                    {% if records %}
                        {% for row in records %}
                        <tr class="hover:bg-gray-50">
                            <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm">{{ loop.index }}</td>
                            <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm font-medium text-gray-900">{{ row[0] }}</td>
                            <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm text-gray-700 font-mono">{{ row[1] }}</td>
                            <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm text-gray-500">{{ row[2] }}</td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td colspan="4" class="px-5 py-5 border-b border-gray-200 bg-white text-sm text-center text-gray-500">Chưa có dữ liệu nào được tìm thấy...</td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
